        <span class="glimps-text">Glimpse</span>

    <div class="reg-card">

       
        <div class="reg-line"></div>

        <h2 id="create-an-account">Sign In</h2>

        <form id="loginForm">

           
            <div class="field">
                <label class="email-text">Email Address</label>
                <div class="input-wrap">
                    <span class="input-icon"><svg width="20" height="16" viewBox="0 0 20 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M2 16C1.45 16 0.979167 15.8042 0.5875 15.4125C0.195833 15.0208 0 14.55 0 14V2C0 1.45 0.195833 0.979167 0.5875 0.5875C0.979167 0.195833 1.45 0 2 0H18C18.55 0 19.0208 0.195833 19.4125 0.5875C19.8042 0.979167 20 1.45 20 2V14C20 14.55 19.8042 15.0208 19.4125 15.4125C19.0208 15.8042 18.55 16 18 16H2ZM10 9L2 4V14H18V4L10 9ZM10 7L18 2H2L10 7ZM2 4V2V4V14V4Z" fill="#ADAAAA"/>
                        </svg>
                    </span>
                    <input type="email" id="email" placeholder="ryangosling@gmail.com" required >
                </div>
            </div>
           
            <div class="field">
                <label class="email-text">Password</label>
                <div class="input-wrap">
                    <span class="input-icon"><svg id="Lock" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M16.4232 9.4478V7.3008C16.4232 4.7878 14.3852 2.7498 11.8722 2.7498C9.35925 2.7388 7.31325 4.7668 7.30225 7.2808V7.3008V9.4478" stroke="#ADAAAA" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
                        <path d="M11.9998 21.2496H15.683C17.777 21.2496 19.475 19.5526 19.475 17.4576V13.1686C19.475 11.0736 17.777 9.3766 15.683 9.3766H8.042C5.948 9.3766 4.25 11.0736 4.25 13.1686V17.4576C4.25 19.5526 5.948 21.2496 8.042 21.2496H8.95225" stroke="#ADAAAA" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
                        <path d="M11.8628 14.2027V16.4237" stroke="#ADAAAA" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
                    </svg></span>
                    <input type="password" id="password" placeholder="">
                </div>
            </div>

            <button type="submit" class="signup-btn">Sign In</button>
 
        </form>

        <p class="auth-switch">
            Dont have an account? <a href="register.html">Create an Account</a>
        </p>

    </div>
</div>

<script src="/registration/js/login.js"></script>

</html>
