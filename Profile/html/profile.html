<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Glimpse Profile</title>
    <link rel="stylesheet" href="/Profile/css/profile.css">
</head>
<body>

<header class="profile-header">
    <div class="logo">Glimpse</div>

    <nav>
        <a href="/">Discover</a>
        <a href="#" onclick="showSection('stats')">Dashboard</a>
        <a href="#" onclick="showSection('list')">My List</a>
    </nav>

    <div class="header-user">
        <button id="menuBtn">☰</button>

        <div id="dropdownMenu" class="dropdown hidden">
            <button onclick="showSection('stats')">Dashboard</button>
            <button onclick="showSection('list')">My List</button>
            <button onclick="showSection('settings')">Settings</button>
            <button id="logoutBtn">Logout</button>
        </div>
    </div>
</header>

<main class="profile-shell">

    <aside class="user-card">
        <div class="avatar">G</div>
        <h2 id="profileName">Glimpse User</h2>
        <p>Track your anime journey.</p>

        <div class="user-info">
            <span>Joined</span>
            <b>2026</b>
        </div>

        <div class="user-info">
            <span>Status</span>
            <b>Online</b>
        </div>

        <button onclick="showSection('list')" class="main-btn">Open My List</button>
        <button onclick="showSection('settings')" class="main-btn">Settings</button>

        <div class="folder-section">
            <div class="folder-header">
                <h3>Folders</h3>
                <button id="addFolderBtn">+</button>
            </div>

            <div id="foldersList"></div>
        </div>
    </aside>

    <section class="dashboard">

        <section id="statsSection">
            <h1>Your Dashboard</h1>

            <div class="metric-grid">
                <div class="metric-card">
                    <p>Total Titles</p>
                    <h2 id="total">0</h2>
                </div>

                <div class="metric-card">
                    <p>Watching</p>
                    <h2 id="watching">0</h2>
                </div>

                <div class="metric-card">
                    <p>Completed</p>
                    <h2 id="completed">0</h2>
                </div>

                <div class="metric-card">
                    <p>Average Rating</p>
                    <h2 id="average">0</h2>
                </div>
            </div>

            <div class="dashboard-grid">
                <div class="panel">
                    <h2>Progress Overview</h2>
                    <div id="progressOverview"></div>
                </div>

                <div class="panel">
                    <h2>Recent Updates</h2>
                    <div id="lastUpdates"></div>
                </div>
            </div>

            <div class="dashboard-grid">
                <div class="panel">
                    <h2>Top Genres</h2>
                    <div id="genres"></div>
                </div>

                <div class="panel">
                    <h2>Favorites</h2>
                    <div id="favorites"></div>
                </div>
            </div>
        </section>

        <section id="listSection" class="hidden">
            <h1>My List</h1>

            <div class="filter-tabs" id="typeFilters">
                <button data-type="all" onclick="setTypeFilter('all')">All</button>
                <button data-type="anime" onclick="setTypeFilter('anime')">Anime</button>
                <button data-type="manga" onclick="setTypeFilter('manga')">Manga</button>
                <button data-type="game" onclick="setTypeFilter('game')">Games</button>
                <button data-type="movie" onclick="setTypeFilter('movie')">Movies</button>
                <button data-type="book" onclick="setTypeFilter('book')">Books</button>
            </div>

            <div class="filter-tabs" id="statusFilters">
                <button data-status="all" onclick="setStatusFilter('all')">All</button>
                <button data-status="Watching" onclick="setStatusFilter('Watching')">Watching</button>
                <button data-status="Completed" onclick="setStatusFilter('Completed')">Completed</button>
                <button data-status="On Hold" onclick="setStatusFilter('On Hold')">On Hold</button>
                <button data-status="Dropped" onclick="setStatusFilter('Dropped')">Dropped</button>
                <button data-status="Plan to Watch" onclick="setStatusFilter('Plan to Watch')">Plan to Watch</button>
            </div>

            <div class="list-tools">
                <input
                        id="listSearchInput"
                        type="text"
                        placeholder="Search in my list..."
                >

                <select id="sortSelect">
                    <option value="recent">Last Updated</option>
                    <option value="nameAZ">Name A-Z</option>
                    <option value="nameZA">Name Z-A</option>
                    <option value="ratingHigh">Rating High-Low</option>
                    <option value="ratingLow">Rating Low-High</option>
                    <option value="episodesHigh">Episodes High-Low</option>
                    <option value="episodesLow">Episodes Low-High</option>
                </select>
            </div>

            <div id="myList"></div>
        </section>

        <section id="settingsSection" class="hidden">
            <h1>Account Settings</h1>

            <div class="panel settings-panel">
                <label>Email</label>
                <input id="settingsEmail" type="email">

                <label>Username</label>
                <input id="settingsUsername" type="text">

                <label>Password</label>
                <input id="settingsPassword" type="text">

                <button id="saveSettingsBtn">Save Changes</button>
                <button id="deleteAccountBtn" class="delete-account-btn">
                    Delete Account
                </button>
            </div>
        </section>

    </section>

</main>

<script src="/Profile/js/profile.js"></script>
</body>
</html>
