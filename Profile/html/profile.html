<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Glimpse Profile</title>
    <link rel="stylesheet" href="../css/profile.css">
</head>
<body>

<header class="profile-header">
    <div class="logo">Glimpse</div>

    <nav>
        <a href="../../main/html/index_homePage_SearchBar.html">Discover</a>
        <a href="#" onclick="showSection('stats')">Dashboard</a>
        <a href="#" onclick="showSection('list')">My List</a>
    </nav>

    <div class="header-user">
        <button id="menuBtn">☰</button>

        <div id="dropdownMenu" class="dropdown hidden">
            <button onclick="showSection('stats')">Dashboard</button>
            <button onclick="showSection('list')">My List</button>
            <button>Settings</button>
        </div>
    </div>
</header>

<main class="profile-shell">

    <aside class="user-card">
        <div class="avatar">G</div>
        <h2 id="profileName">Glimpse User</h2>
        <p>Track your anime journey.</p>

        <div class="user-info">
            <span>Joined</span>
            <b>2026</b>
        </div>

        <div class="user-info">
            <span>Status</span>
            <b>Online</b>
        </div>

        <button onclick="showSection('list')" class="main-btn">Open My List</button>

        <div class="folder-section">
            <div class="folder-header">
                <h3>Folders</h3>
                <button id="addFolderBtn">+</button>
            </div>

            <div id="foldersList"></div>
        </div>
    </aside>

    <section class="dashboard">

        <section id="statsSection">
            <h1>Your Dashboard</h1>

            <div class="metric-grid">
                <div class="metric-card">
                    <p>Total Titles</p>
                    <h2 id="total">0</h2>
                </div>

                <div class="metric-card">
                    <p>Watching</p>
                    <h2 id="watching">0</h2>
                </div>

                <div class="metric-card">
                    <p>Completed</p>
                    <h2 id="completed">0</h2>
                </div>

                <div class="metric-card">
                    <p>Average Rating</p>
                    <h2 id="average">0</h2>
                </div>
            </div>

            <div class="dashboard-grid">
                <div class="panel">
                    <h2>Progress Overview</h2>
                    <div id="progressOverview"></div>
                </div>

                <div class="panel">
                    <h2>Recent Updates</h2>
                    <div id="lastUpdates"></div>
                </div>
            </div>

            <div class="dashboard-grid">
                <div class="panel">
                    <h2>Top Genres</h2>
                    <div id="genres"></div>
                </div>

                <div class="panel">
                    <h2>Favorites</h2>
                    <div id="favorites"></div>
                </div>
            </div>
        </section>

        <section id="listSection" class="hidden">
            <h1>My List</h1>
            <div class="filter-tabs" id="typeFilters">
                <button onclick="setTypeFilter('all')">All</button>
                <button onclick="setTypeFilter('anime')">Anime</button>
                <button onclick="setTypeFilter('manga')">Manga</button>
                <button onclick="setTypeFilter('game')">Games</button>
                <button onclick="setTypeFilter('movie')">Movies</button>
                <button onclick="setTypeFilter('book')">Books</button>
            </div>

            <div class="filter-tabs" id="statusFilters">
                <button onclick="setStatusFilter('all')">All</button>
                <button onclick="setStatusFilter('Watching')">Watching</button>
                <button onclick="setStatusFilter('Completed')">Completed</button>
                <button onclick="setStatusFilter('On Hold')">On Hold</button>
                <button onclick="setStatusFilter('Dropped')">Dropped</button>
                <button onclick="setStatusFilter('Plan to Watch')">Plan to Watch</button>
            </div>
            <div id="myList"></div>
        </section>

        <section id="folderSection" class="hidden">
            <h1>Folder</h1>

            <div class="folder-top">
                <input id="folderNameInput" placeholder="Folder name">

                <button id="renameFolderBtn">Rename</button>
                <button id="deleteFolderBtn">Delete</button>
                <button id="addTitleToFolderBtn">+</button>
            </div>

            <input
                    id="folderSearchInput"
                    class="hidden"
                    placeholder="Search your titles..."
            >

            <div id="folderSearchResults"></div>

            <h2>Folder Titles</h2>
            <div id="folderTitles"></div>
        </section>

    </section>

</main>

<script src="../js/profile.js"></script>
</body>
</html>
