<!DOCTYPE html>
<html>
<head>
    <title>Glimpse</title>
    <link rel="stylesheet" href="../styles/index.css">
</head>
<body>

<nav>
    <h2>Glimpse</h2>
    <a href="../../Profile/html/profile.html">Profile</a>
</nav>

<section class="hero">
    <h1>Discover Anime</h1>
    <p>Search anime and add titles to your list.</p>

    <div class="search-wrapper">
        <select id="searchType">
            <option value="anime">Anime</option>
        </select>

        <input
                id="searchInput"
                placeholder="Search anime..."
                autocomplete="off"
                oninput="liveSearchAnime()"
        >

        <button onclick="searchAnime()">🔍</button>

        <div id="liveResults" class="live-results"></div>
    </div>
</section>

<main>
    <h2>Search Results</h2>
    <div id="results" class="grid"></div>
</main>

<script src="../js/index_homePage_SearchBar.js"></script>
</body>
</html>
